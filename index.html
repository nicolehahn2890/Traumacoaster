<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1b2a4a" />
    <title>Trauma Coaster</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
    <link href="/fonts/illudiy.css" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ff5c8a'/%3E%3Cpath d='M10 44 C 20 10, 44 10, 54 44' stroke='%23fff' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1b2a4a; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:600 16px/1.5 Nunito,system-ui,sans-serif;text-align:center;padding:24px;pointer-events:none">Trauma Coaster lädt …</div>
    <script>
      // Startanzeige und sichtbare Fehler, damit ein schwarzer Bildschirm nie stumm bleibt
      (function () {
        var boot = document.getElementById('boot');
        var done = false;
        function show(msg) {
          if (!boot) return;
          boot.style.display = 'flex';
          boot.style.pointerEvents = 'auto';
          boot.innerHTML = '<div style="max-width:520px;background:rgba(0,0,0,.45);border-radius:16px;padding:20px"><b>Trauma Coaster konnte nicht starten.</b><br><br>' +
            String(msg).replace(/</g, '&lt;') + '</div>';
        }
        var reloadKey = 'tc.reloadedAfterScriptError';
        window.tcBootDone = function () {
          done = true;
          if (boot) boot.style.display = 'none';
          try { sessionStorage.removeItem(reloadKey); } catch (err) { /* ignore */ }
        };
        window.tcBootError = show;
        // Skript nicht ladbar: fast immer eine veraltete, gecachte Startseite direkt nach einem Deploy
        // (sie verweist auf eine Skriptdatei, die es nicht mehr gibt). Einmal am Cache vorbei neu laden, sonst Hinweis.
        function scriptFailed(src) {
          var already = false;
          try { already = sessionStorage.getItem(reloadKey) === '1'; } catch (err) { /* ignore */ }
          if (!already) {
            try { sessionStorage.setItem(reloadKey, '1'); } catch (err) { /* ignore */ }
            var u = new URL(location.href);
            u.searchParams.set('r', String(Date.now()));
            location.replace(u.toString());
            return;
          }
          show('Das Spiel-Skript konnte nicht geladen werden (' + src + '). Bitte die Seite neu laden, am Computer mit Strg+F5.');
        }
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && t !== window && t.tagName === 'SCRIPT' && t.src) scriptFailed(t.src);
        }, true);
        window.addEventListener('error', function (e) {
          if (e && e.target && e.target !== window && e.target.tagName) return; // Ressourcenfehler: oben behandelt
          show((e && e.message) || 'Unbekannter Fehler');
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason;
          show(r && (r.stack || r.message) ? (r.stack || r.message) : String(r));
        });
        var problems = [];
        if (typeof WebAssembly === 'undefined') problems.push('WebAssembly ist nicht verfügbar.');
        try {
          var c = document.createElement('canvas');
          if (!(c.getContext('webgl2') || c.getContext('webgl'))) problems.push('WebGL ist nicht verfügbar.');
        } catch (err) { problems.push('WebGL ist nicht verfügbar.'); }
        if (problems.length) show(problems.join(' ') + ' Bitte in Safari oder Chrome öffnen.');
        setTimeout(function () {
          if (!done && boot && boot.textContent === 'Trauma Coaster lädt …') show('Das Spiel antwortet nicht. Bitte die Seite neu laden, am Computer mit Strg+F5. Hilft das nicht, wurde vermutlich das Laden des Skripts blockiert.');
        }, 20000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
